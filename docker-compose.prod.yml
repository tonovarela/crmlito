services:
  app:
    # Producción: el código va dentro de la imagen (no se monta). Reconstruir con
    #   docker compose -f docker-compose.prod.yml up -d --build
    build:
      context: .
      target: production
    image: crmlito:8.3
    restart: unless-stopped
    ports:
      - "8091:80"
    env_file: .env
    volumes:
      # Logs y archivos de storage/ sobreviven a los rebuilds
      - storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  storage:
