services:
  app:
    # Producción: la imagen se publica en GHCR desde GitHub Actions. Desplegar con
    #   docker compose -f docker-compose.prod.yml pull
    #   docker compose -f docker-compose.prod.yml up -d
    # IMAGE_TAG (en .env) fija una versión, p. ej. 1.2.0 o sha-abc1234; por defecto latest.
    image: ghcr.io/tonovarela/crmlito:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8091:80"
    env_file: .env
    volumes:
      # Logs y archivos de storage/ sobreviven a los rebuilds
      - storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  storage:
