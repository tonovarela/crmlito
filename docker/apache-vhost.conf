# La app se publica bajo /crmlito: public/.htaccess usa "RewriteBase /crmlito"
# y el JS/plantillas tienen rutas /crmlito/ escritas a mano.
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/empty

    RedirectMatch 302 ^/$ /crmlito/

    Alias /crmlito /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
