; Configuración propia de crmlito (se carga después de php.ini-production)
date.timezone = America/Guatemala
expose_php = Off

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
upload_max_filesize = 100M
post_max_size = 100M

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; En producción el código no cambia; en desarrollo docker-compose lo pone en 1
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
