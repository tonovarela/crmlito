services:
  app:
    # Entorno de desarrollo: monta el código. La imagen de producción se construye con
    #   docker build --target production -t crmlito:8.3 .
    build:
      context: .
      target: base
    image: crmlito:dev
    ports:
      - "8091:80"   # http://localhost:8091
    env_file: .env
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
      # Sin config/route/view:cache para que los cambios se vean al recargar
      APP_ENV: local
      DB_TRUST_SERVER_CERTIFICATE: "true"
      MAIL_MAILER: log
    volumes:
      - ./:/var/www/html
    extra_hosts:
      # Permite usar DB_HOST=host.docker.internal si SQL Server corre en el host
      - "host.docker.internal:host-gateway"
